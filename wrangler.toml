name = "stack-task-tracker"
main = "worker/src/index.js"
compatibility_date = "2026-07-14"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "stack-db"
database_id = "76f9c319-da53-4774-af79-d0e563008252"

# All reminders are scheduled by a single Durable Object using alarms
# (see worker/src/scheduler.js). No cron triggers are used; the empty
# list below removes the old ones from your deployed Worker.
[triggers]
crons = []

[[durable_objects.bindings]]
name = "SCHEDULER"
class_name = "ReminderScheduler"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ReminderScheduler"]

[observability]
enabled = true

# Secrets (set these with `wrangler secret put <NAME>`, never commit them here):
#   APP_PASSCODE           - the passcode you use to unlock the app
#   VAPID_SUBJECT           - e.g. "mailto:you@example.com"
#   VAPID_PUBLIC_KEY        - from `npx web-push generate-vapid-keys`
#   VAPID_PRIVATE_KEY       - from `npx web-push generate-vapid-keys`
