<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Stack</title>
  <meta name="description" content="An activity board: move sticky notes from Not started to Completed." />
  <meta name="theme-color" content="#14161a" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- Passcode gate -->
  <div class="gate" id="gate">
    <div class="gate-card">
      <div class="gate-mark">STA<span>CK</span></div>
      <div class="gate-sub">move it across the board.</div>
      <input id="passcode-input" type="password" inputmode="numeric" placeholder="passcode" autocomplete="off" />
      <div class="gate-error" id="gate-error"></div>
      <button class="btn-primary" id="unlock-btn">Unlock</button>
    </div>
  </div>

  <div class="app" id="app" hidden>
    <header class="nav">
      <div class="nav-left">
        <button class="project-btn" id="project-btn" aria-haspopup="menu" aria-expanded="false">
          <span class="dot" id="project-dot"></span>
          <span class="project-btn-label" id="project-label">All projects</span>
          <span class="caret" aria-hidden="true">▾</span>
        </button>
      </div>

      <div class="search">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input type="search" id="search-input" placeholder="Search activities, notes & archive" autocomplete="off" />
      </div>

      <div class="nav-actions">
        <button class="btn-primary btn-new" id="new-btn"><span aria-hidden="true">+</span><span class="btn-new-label"> New</span></button>
        <button class="icon-btn" id="bell-btn" aria-label="Notifications" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22Zm7-6V11a7 7 0 0 0-5.5-6.84V3.5a1.5 1.5 0 0 0-3 0v.66A7 7 0 0 0 5 11v5l-2 2v1h18v-1l-2-2Z"/></svg>
          <span class="badge" id="bell-badge" hidden></span>
        </button>
        <button class="icon-btn" id="menu-btn" aria-label="Menu" aria-haspopup="menu">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="5" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="19" r="2" fill="currentColor"/></svg>
        </button>
      </div>
    </header>

    <div class="search-banner" id="search-banner" hidden></div>

    <!-- Mobile only: one column at a time, swipe or tap a tab -->
    <nav class="col-tabs" id="col-tabs" aria-label="Columns"></nav>

    <main class="board" id="board"></main>
  </div>

  <!-- Popover menus (positioned by JS) -->
  <div class="popover" id="popover" hidden></div>

  <!-- Activity detail / create -->
  <dialog class="sheet sheet-detail" id="detail-sheet" aria-label="Activity"></dialog>

  <!-- Manage projects -->
  <dialog class="sheet" id="projects-sheet" aria-label="Projects"></dialog>

  <!-- Archive -->
  <dialog class="sheet" id="archive-sheet" aria-label="Archive"></dialog>

  <!-- Settings -->
  <dialog class="sheet" id="settings-sheet" aria-label="Settings"></dialog>

  <!-- Notifications -->
  <dialog class="sheet sheet-narrow" id="notif-sheet" aria-label="Notifications"></dialog>

  <!-- Confirm -->
  <dialog class="confirm" id="confirm-dialog">
    <form method="dialog">
      <p id="confirm-message"></p>
      <div class="confirm-actions">
        <button value="cancel" class="btn-ghost">Cancel</button>
        <button value="ok" class="btn-danger" id="confirm-ok">Delete</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
